<svg fill="none" viewBox="0 0 800 220" width="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 36px;
      fill: url(#gradient-title);
      letter-spacing: 5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #94a3b8;
      letter-spacing: 2px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
      letter-spacing: 1px;
    }
    .grid-lines {
      stroke: #334155;
      stroke-opacity: 0.15;
    }
  </style>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Title Gradient -->
    <linearGradient id="gradient-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />
  
  <!-- Cyber / Circuit decorative lines -->
  <g class="grid-lines" stroke-width="1">
    <!-- Horizontal lines -->
    <line x1="0" y1="45" x2="800" y2="45" />
    <line x1="0" y1="175" x2="800" y2="175" />
    <!-- Vertical lines -->
    <line x1="180" y1="0" x2="180" y2="220" />
    <line x1="620" y1="0" x2="620" y2="220" />
    
    <!-- Circuit path circles/dots -->
    <circle cx="180" cy="45" r="4" fill="#818cf8" />
    <circle cx="620" cy="175" r="4" fill="#f472b6" />
    <circle cx="180" cy="175" r="4" fill="#c084fc" />
    <circle cx="620" cy="45" r="4" fill="#e2e8f0" />
    
    <!-- Angled paths -->
    <path d="M 120 0 L 180 60 L 260 60" fill="none" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
    <path d="M 680 220 L 620 160 L 540 160" fill="none" stroke="#f472b6" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <!-- Content -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="400" y="95" class="title">YUNUS EMRE YILMAZ</text>
    
    <!-- Subtitle -->
    <text x="400" y="130" class="subtitle">Electrical-Electronics Engineering Student</text>
    
    <!-- Glowing Accent -->
    <line x1="280" y1="150" x2="520" y2="150" stroke="url(#gradient-title)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Tech Fields -->
    <g transform="translate(400, 185)">
      <!-- Embedded -->
      <circle cx="-170" cy="-4" r="5" fill="#818cf8" />
      <text x="-155" y="0" class="tag-text" text-anchor="start">Embedded Systems</text>
      
      <!-- Linux -->
      <circle cx="-35" cy="-4" r="5" fill="#34d399" />
      <text x="-20" y="0" class="tag-text" text-anchor="start">Linux Development</text>
      
      <!-- Control -->
      <circle cx="105" cy="-4" r="5" fill="#fbbf24" />
      <text x="120" y="0" class="tag-text" text-anchor="start">Control Systems</text>
    </g>
  </g>
</svg>
